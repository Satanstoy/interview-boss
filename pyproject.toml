[project]
name = "interview-boss"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.104.1",
    "openai>=1.30.0",
    "pydantic>=2.7.4",
    "python-dotenv==1.0.0",
    "python-multipart==0.0.6",
    "tenacity>=9.1.4",
    "uvicorn==0.24.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0,<4.1",
    "python-jose[cryptography]>=3.3.0",
    "slowapi>=0.1.9",
    "python-magic>=0.4.27",
    "anthropic>=0.100.0",
    "arq>=0.28.0",
    "redis>=5.3.1",
    "langgraph>=1.1.0",
    "pypdf>=6.12.0",
    "httpx[socks]<0.28",
    "pyyaml>=6.0.3",
    "socksio>=1.0.0",
    "sentence-transformers>=5.5.1",
    "faiss-cpu>=1.14.2",
    "structlog>=24.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.27.0",
]

[tool.uv]
override-dependencies = [
    "torch>=2.0.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://mirrors.nju.edu.cn/pytorch/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
markers = [
    "slow: 需要较长时间的测试",
    "integration: 集成测试（需要外部服务）",
]
addopts = "-v --tb=short"
