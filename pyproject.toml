[project]
name = "interview-boss"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.1",
    "openai>=1.30.0",
    "pydantic>=2.7.4",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.31",
    "tenacity>=9.1.4",
    "uvicorn==0.24.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0,<4.1",
    "python-jose[cryptography]>=3.3.0",
    "slowapi>=0.1.9",
    "python-magic>=0.4.27",
    "anthropic>=0.100.0",
    "arq>=0.28.0",
    "redis>=5.3.1",
    "langgraph>=1.1.0",
    "httpx[socks]<0.28",
    "pyyaml>=6.0.3",
    "socksio>=1.0.0",
    "faiss-cpu>=1.14.2",
    "onnxruntime>=1.23.0,<1.24.0",
    "tokenizers>=0.22.0",
    "huggingface-hub>=1.0.0",
    "structlog>=24.1.0",
    "aiohttp>=3.14.1",
    "mcp>=1.12.4",
    "pdfplumber>=0.11.10",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.27.0",
    "ruff>=0.16.3",
    "mypy>=2.3.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
markers = [
    "slow: 需要较长时间的测试",
    "integration: 集成测试（需要外部服务）",
    "live_llm: 需要真实 LLM API 的测试，默认离线套件不收集",
]
filterwarnings = [
    'ignore:Using `httpx` with `starlette.testclient` is deprecated.*:Warning',
    'ignore:\s*on_event is deprecated, use lifespan event handlers instead\..*:DeprecationWarning',
    'ignore:The `local_dir_use_symlinks` argument is deprecated and ignored in `snapshot_download`.*:UserWarning',
]
addopts = "-v --tb=short"

[tool.ruff]
# 阶段 A: 先立闸防膨胀。全仓当前仍有历史累积违例,ruff 以 audit WARN 接入,
# 只报告不拦截(对齐 CLAUDE.md「audit 第一阶段只报告不拦截」)。
# 后续随债务清偿逐步收紧为 blocking。
target-version = "py312"
line-length = 100
src = ["backend/app", "backend/tests"]
fix = false
exclude = [
  "backend/app/mcp_server/**",
  "backend/scripts/**",
]

[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
]
ignore = [
  "E402",
]
per-file-ignores = {
  "backend/app/services/chat_service.py" = ["F401"],
}

[tool.mypy]
# 阶段 A: 同样以 audit WARN 接入,只采集不拦截。
python_version = "3.12"
warn_unused_ignores = false
ignore_missing_imports = true
check_untyped_defs = false
no_site_packages = true

