# InterviewBoss Docker Compose（内网高性能部署版）
# 用法：
#   首次部署: ./deploy/docker-deploy.sh all
#   更新部署: ./deploy/docker-deploy.sh update
#   启动 Worker: ./deploy/docker-deploy.sh worker-up
#   停止 Worker: ./deploy/docker-deploy.sh worker-down
#   查看日志: ./deploy/docker-deploy.sh logs backend

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    compress: "true"

x-app-build: &app-build
  context: .
  dockerfile: Dockerfile
  target: app-runtime
  network: host
  args:
    BUILDKIT_INLINE_CACHE: "1"
    NPM_MIRROR: ${NPM_MIRROR:-https://registry.npmmirror.com}
    PYPI_MIRROR: ${PYPI_MIRROR:-https://mirrors.cloud.tencent.com/pypi/simple/}
    APT_MIRROR: ${APT_MIRROR:-mirrors.aliyun.com}
    APK_MIRROR: ${APK_MIRROR:-mirrors.aliyun.com}

x-app-service: &app-service
  image: interview-boss-app:local
  build: *app-build
  env_file: backend/.env
  environment:
    - REDIS_HOST=redis
    - REDIS_CACHE_HOST=redis-cache
    - REDIS_PASSWORD_FILE=/run/secrets/redis_password
    - HF_HUB_OFFLINE=1
    - HF_HOME=/home/appuser/.cache/huggingface
    - ENV=production
    - EMBEDDING_BACKEND=siliconflow
    - EMBEDDING_MODEL_DIR=/app/models/bge-small-zh-v1.5
    - EMBEDDING_OFFLINE=1
  volumes:
    - ./backend/data:/app/backend/data
    - /home/ubuntu/.cache/huggingface:/home/appuser/.cache/huggingface:ro
    - /home/ubuntu/.cache/huggingface/hub/models--Xenova--bge-small-zh-v1.5/snapshots/main:/app/models/bge-small-zh-v1.5:ro
  networks:
    - data-network
  secrets:
    - redis_password
  security_opt:
    - no-new-privileges:true
  depends_on:
    redis:
      condition: service_healthy
    redis-cache:
      condition: service_healthy
  logging: *default-logging

services:
  # ── Redis ──
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # ARQ 的可靠任务队列：不允许用 LRU 淘汰任务数据。
    # 128MB maxmemory + 64MB 容器余量，用于连接、AOF 和内存碎片。
    command:
      - sh
      - -c
      - >-
        test -s /run/secrets/redis_password || { echo 'redis_password secret is required' >&2; exit 1; };
        exec redis-server --maxmemory 128mb --maxmemory-policy noeviction
        --appendonly yes --appendfsync everysec
        --requirepass "$$(cat /run/secrets/redis_password)"
    volumes:
      - redis-data:/data
    mem_limit: 192m
    cpus: 0.25
    networks:
      - data-network
    secrets:
      - redis_password
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$(cat /run/secrets/redis_password)\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging: *default-logging

  # ── Redis Cache（可丢弃的用户读模型缓存）──
  redis-cache:
    image: redis:7.4-alpine
    restart: unless-stopped
    # Cache 不需要持久化；达到上限时淘汰旧缓存，不影响 queue 实例。
    command:
      - sh
      - -c
      - >-
        test -s /run/secrets/redis_password || { echo 'redis_password secret is required' >&2; exit 1; };
        exec redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
        --save "" --appendonly no
        --requirepass "$$(cat /run/secrets/redis_password)"
    mem_limit: 320m
    cpus: 0.25
    networks:
      - data-network
    secrets:
      - redis_password
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$(cat /run/secrets/redis_password)\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging: *default-logging

  # ── FastAPI 后端 ──
  backend:
    <<: *app-service
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 512m
    cpus: 0.75
    networks:
      - edge-network
      - data-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── ARQ Worker（按需启用：--profile worker）──
  worker:
    <<: *app-service
    profiles:
      - worker
    restart: unless-stopped
    command: ["uv", "run", "arq", "app.worker.WorkerSettings"]
    mem_limit: 384m
    cpus: 0.75

  # ── Test（pytest 测试环境，按需启用：--profile test）──
  test:
    image: interview-boss-test:local
    build:
      context: .
      dockerfile: Dockerfile
      target: test-runtime
      network: host
      args:
        BUILDKIT_INLINE_CACHE: "1"
        NPM_MIRROR: ${NPM_MIRROR:-https://registry.npmmirror.com}
        PYPI_MIRROR: ${PYPI_MIRROR:-https://mirrors.cloud.tencent.com/pypi/simple/}
        APT_MIRROR: ${APT_MIRROR:-mirrors.aliyun.com}
        APK_MIRROR: ${APK_MIRROR:-mirrors.aliyun.com}
    profiles:
      - test
    env_file: backend/.env
    environment:
      - REDIS_HOST=redis
      - REDIS_CACHE_HOST=redis-cache
      - REDIS_PASSWORD_FILE=/run/secrets/redis_password
      - HF_HUB_OFFLINE=1
      - HF_HOME=/home/appuser/.cache/huggingface
      - ENV=test
    volumes:
      - ./backend:/app/backend:ro
      - ./backend/data:/app/backend/data
      # frontend-contract 结构测试需要读取 frontend/src 源码(经 /app/frontend 相对路径)
      - ./frontend:/app/frontend:ro
      - /home/ubuntu/.cache/huggingface:/home/appuser/.cache/huggingface:ro
    networks:
      - data-network
    secrets:
      - redis_password
    depends_on:
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    logging: *default-logging

  # ── Nginx（前端静态产物 + 反向代理）──
  nginx:
    image: interview-boss-nginx:local
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx-runtime
      network: host
      args:
        BUILDKIT_INLINE_CACHE: "1"
        NPM_MIRROR: ${NPM_MIRROR:-https://registry.npmmirror.com}
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "127.0.0.1:8081:80"
    mem_limit: 64m
    cpus: 0.25
    networks:
      - edge-network
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
    logging: *default-logging

  # ── OAuth Gateway（ChatGPT MCP 连接器 OAuth 2.1 网关）──
  oauth-gateway:
    build:
      context: ./oauth-gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8082"
    mem_limit: 64m
    cpus: 0.25
    env_file: backend/.env
    environment:
      # OAuth 密钥只从 backend/.env 注入；缺失时网关启动失败。
      - INTERVIEW_BOSS_DB=/app/data/interview-boss.db
      - INTERVIEW_BOSS_URL=http://backend:8000
      - GATEWAY_BASE_URL=${GATEWAY_BASE_URL:-https://www.interviewboss.online}
    volumes:
      - ./backend/data:/app/data:ro
      - oauth-gateway-data:/app/oauth-data
    networks:
      - edge-network
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
    logging: *default-logging

networks:
  edge-network:
    driver: bridge
  data-network:
    driver: bridge

secrets:
  redis_password:
    file: ./backend/.redis-password

volumes:
  redis-data:
  oauth-gateway-data:
