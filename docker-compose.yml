# InterviewBoss Docker Compose（内网高性能部署版）
# 用法：
#   首次部署: ./deploy/docker-deploy.sh all
#   更新部署: ./deploy/docker-deploy.sh update
#   启动 Worker: ./deploy/docker-deploy.sh worker-up
#   停止 Worker: ./deploy/docker-deploy.sh worker-down
#   查看日志: ./deploy/docker-deploy.sh logs backend

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-build: &app-build
  context: .
  dockerfile: Dockerfile
  target: app-runtime
  args:
    BUILDKIT_INLINE_CACHE: "1"

x-app-service: &app-service
  image: interview-boss-app:local
  build: *app-build
  env_file: backend/.env
  environment:
    - REDIS_URL=redis://redis:6379/0
    - HF_HUB_OFFLINE=1
    - HF_HOME=/home/appuser/.cache/huggingface
    - ENV=production
    - EMBEDDING_BACKEND=onnx
    - EMBEDDING_MODEL_DIR=/app/models/bge-small-zh-v1.5
    - EMBEDDING_OFFLINE=1
  volumes:
    - ./backend/data:/app/backend/data
    - /home/ubuntu/.cache/huggingface:/home/appuser/.cache/huggingface:ro
    - /home/ubuntu/.cache/huggingface/hub/models--Xenova--bge-small-zh-v1.5/snapshots/main:/app/models/bge-small-zh-v1.5:ro
  networks:
    - app-network
  security_opt:
    - no-new-privileges:true
  depends_on:
    redis:
      condition: service_healthy
  logging: *default-logging

services:
  # ── Redis ──
  redis:
    image: redis:7.4-alpine
    restart: always
    command: redis-server --maxmemory 96mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis-data:/data
    mem_limit: 128m
    cpus: 0.25
    networks:
      - app-network
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging: *default-logging

  # ── FastAPI 后端 ──
  backend:
    <<: *app-service
    restart: always
    mem_limit: 512m
    cpus: 0.75
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── ARQ Worker（按需启用：--profile worker）──
  worker:
    <<: *app-service
    profiles:
      - worker
    restart: unless-stopped
    command: ["uv", "run", "arq", "app.worker.WorkerSettings"]
    mem_limit: 384m
    cpus: 0.75

  # ── Test（pytest 测试环境，按需启用：--profile test）──
  test:
    image: interview-boss-test:local
    build:
      context: .
      dockerfile: Dockerfile
      target: test-runtime
      args:
        BUILDKIT_INLINE_CACHE: "1"
    profiles:
      - test
    env_file: backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - HF_HUB_OFFLINE=1
      - HF_HOME=/home/appuser/.cache/huggingface
      - ENV=test
    volumes:
      - ./backend/data:/app/backend/data
      - /home/ubuntu/.cache/huggingface:/home/appuser/.cache/huggingface:ro
    networks:
      - app-network
    depends_on:
      redis:
        condition: service_healthy
    logging: *default-logging

  # ── Nginx（前端静态产物 + 反向代理）──
  nginx:
    image: interview-boss-nginx:local
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx-runtime
      args:
        BUILDKIT_INLINE_CACHE: "1"
    restart: always
    ports:
      - "80:80"
    mem_limit: 64m
    cpus: 0.25
    networks:
      - app-network
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
    logging: *default-logging

networks:
  app-network:
    driver: bridge

volumes:
  redis-data:
