name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 前端 job：fresh clone 无 node_modules (gitignored)，必须先 npm ci 引导依赖，
  # 否则 npm run build / npm run test 必红。
  frontend:
    name: Frontend build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Bootstrap frontend dependencies (npm ci)
        run: cd frontend && npm ci
      - name: Frontend build & test
        run: ./scripts/check.sh frontend
      - name: Frontend audit (WARN only, non-blocking)
        run: ./scripts/check.sh audit || true

  # 后端 job：backend/.env 与 backend/.redis-password 均 gitignored 不入库，但
  # docker-compose.yml 用 env_file/secret 引用它们；fresh clone 必须先创建占位，
  # 否则 docker compose 结构检查必红。
  backend:
    name: Backend structure check (Docker) + static gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap backend env files
        run: |
          [ -f backend/.env ] || cp backend/.env.example backend/.env
          printf 'ci-placeholder-redis-password\n' > backend/.redis-password
      - name: Backend structure check (Docker test-runtime)
        run: ./scripts/check.sh backend
      - name: Line guard
        run: ./scripts/check.sh lineguard
      - name: Secret scan
        run: python3 backend/scripts/check_secrets.py

  # 容器镜像扫描（audit round-3 D8）：构建两个可部署镜像并扫 HIGH/CRITICAL 漏洞，
  # 另加 fs/IaC 扫描（uv.lock / package-lock.json / Dockerfile / compose）。
  # 当前遵循项目「audit 只报告不拦截」策略（exit-code 0）；存量清零后收紧为
  # exit-code 1 阻断（与 ruff/mypy/eslint 的收紧节奏一致）。
  container-scan:
    name: Container scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap backend env files
        run: |
          [ -f backend/.env ] || cp backend/.env.example backend/.env
          printf 'ci-placeholder-redis-password\n' > backend/.redis-password
      - name: Build deployable images (app-runtime + nginx)
        run: docker compose build backend nginx
      - name: Trivy scan app image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: interview-boss-app:local
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
      - name: Trivy scan nginx image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: interview-boss-nginx:local
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
      - name: Trivy filesystem + IaC scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-dirs: node_modules,frontend/node_modules,backend/data,.venv,dist
          exit-code: '0'
