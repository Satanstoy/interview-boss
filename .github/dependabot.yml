# 依赖自动更新（audit 2026-08-13/15 D7：无自动升级机器人，Vite 等长期滞后）
# npm: frontend 目录；pip: 根 pyproject.toml + uv.lock；actions: CI workflow 版本
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
