<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InterviewBoss — 授权登录</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); padding: 40px; width: 100%; max-width: 400px; }
    .logo { text-align: center; margin-bottom: 24px; }
    .logo h1 { font-size: 20px; color: #1a1a1a; }
    .logo p { font-size: 13px; color: #666; margin-top: 4px; }
    .client-info { background: #f8f9fa; border-radius: 8px; padding: 12px 16px; margin-bottom: 24px; font-size: 13px; color: #555; }
    .client-info strong { color: #1a1a1a; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; color: #333; margin-bottom: 6px; }
    .form-group input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; transition: border-color 0.2s; }
    .form-group input:focus { border-color: #4f46e5; }
    .btn { width: 100%; padding: 12px; background: #4f46e5; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn:hover { background: #4338ca; }
    .error { background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
    .scope-list { margin-top: 12px; font-size: 12px; color: #888; }
    .scope-list li { margin-left: 16px; margin-bottom: 2px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <h1>InterviewBoss</h1>
      <p>AI 面试备战平台</p>
    </div>

    <div class="client-info">
      <strong>{{ client_name }}</strong> 请求访问你的 InterviewBoss 账户
    </div>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/oauth/authorize">
      <input type="hidden" name="client_id" value="{{ client_id }}">
      <input type="hidden" name="redirect_uri" value="{{ redirect_uri }}">
      <input type="hidden" name="code_challenge" value="{{ code_challenge }}">
      <input type="hidden" name="code_challenge_method" value="{{ code_challenge_method }}">
      <input type="hidden" name="state" value="{{ state }}">
      <input type="hidden" name="resource" value="{{ resource }}">
      <input type="hidden" name="scope" value="{{ scope }}">

      <div class="form-group">
        <label for="username">用户名</label>
        <input type="text" id="username" name="username" required autocomplete="username" autofocus>
      </div>

      <div class="form-group">
        <label for="password">密码</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn">授权登录</button>
    </form>

    <ul class="scope-list">
      <li>读取你的题库数据</li>
      <li>搜索、抽题和选题</li>
    </ul>
  </div>
</body>
</html>
