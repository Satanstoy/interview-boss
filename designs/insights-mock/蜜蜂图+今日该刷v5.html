<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>岗位重点知识 · 蜜蜂图 + 今日该刷 v5</title>
<style>
  :root {
    --bg: #faf9f7; --card: #ffffff; --border: #e8e4dd;
    --fg: #1a1816; --fg-soft: #4a4540; --muted: #8f8881;
    --accent: #6366f1; --green: #10b981; --amber: #f59e0b; --rose: #f43f5e; --slate: #94a3b8;
    --grid: #f1efe9; --chip: #f1efe9;
  }
  [data-theme="dark"] {
    --bg: #1a1816; --card: #221f1c; --border: #2e2a27;
    --fg: #e7e5e2; --fg-soft: #cfcac5; --muted: #8f8881;
    --accent: #818cf8; --green: #34d399; --amber: #fbbf24; --rose: #fb7185; --slate: #64748b;
    --grid: #2e2a27; --chip: #2e2a27;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "SF Pro Text", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.6; -webkit-font-smoothing: antialiased;
  }
  .page { max-width: 900px; margin: 0 auto; padding: 28px 24px 48px; display: flex; flex-direction: column; gap: 20px; }
  .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .page-head h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
  .page-head .sub { font-size: 13px; color: var(--muted); max-width: 680px; margin-top: 4px; }
  .theme-toggle {
    flex-shrink: 0; font-size: 12px; padding: 6px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--card); color: var(--fg-soft); cursor: pointer; font-family: inherit;
  }
  .card { border: 1px solid var(--border); border-radius: 14px; background: var(--card); box-shadow: 0 1px 2px rgba(0,0,0,.04); padding: 20px; }
  .card-title { font-size: 17px; font-weight: 600; }
  .card-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .guide {
    display: flex; align-items: center; gap: 8px; margin-top: 14px; padding: 10px 14px; border-radius: 10px;
    background: color-mix(in srgb, var(--amber) 10%, transparent); border: 1px solid color-mix(in srgb, var(--amber) 30%, transparent);
    font-size: 13px; color: var(--fg-soft);
  }
  .guide strong { color: var(--amber); font-weight: 600; }

  .chart-wrap { margin-top: 14px; display: flex; justify-content: center; }
  .legend { display: flex; gap: 16px; align-items: center; margin-top: 12px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .legend .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 5px; vertical-align: -1px; }

  /* ── 今日该刷列表 ── */
  .today-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 20px; }
  .today-head .tt { font-size: 14px; font-weight: 600; }
  .today-head .ts { font-size: 12px; color: var(--muted); }
  .today-list { margin-top: 8px; display: flex; flex-direction: column; }
  .today-item { display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-bottom: 1px solid var(--border); }
  .today-item:last-child { border-bottom: 0; }
  .today-rank { flex-shrink: 0; width: 22px; height: 22px; border-radius: 6px; background: var(--chip); color: var(--muted); font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
  .today-rank.top { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
  .today-body { flex: 1; min-width: 0; }
  .today-q { font-size: 13px; color: var(--fg-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .today-meta { font-size: 11px; color: var(--muted); margin-top: 1px; display: flex; gap: 8px; }
  .today-tag { font-size: 10px; padding: 1px 7px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 10%, transparent); color: var(--accent); flex-shrink: 0; }
  .today-heat { flex-shrink: 0; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .today-cta { flex-shrink: 0; font-size: 12px; color: var(--accent); font-weight: 500; }
  .today-cta-btn {
    flex-shrink: 0; font-size: 12px; padding: 5px 12px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--border); background: var(--card); color: var(--accent); font-weight: 500; font-family: inherit;
  }
  .today-cta-btn:hover { border-color: var(--accent); }
</style>
</head>
<body data-theme="light">
<div class="page">

  <header class="page-head">
    <div>
      <h1>岗位重点知识 · 蜜蜂图 + 今日该刷 v5</h1>
      <p class="sub">蜜蜂图看「岗位知识地图」（热度分布，不重叠），下方「今日该刷」直接连到八股刷题的 due 队列——热度最高的几道题，点了就去刷。数据全为 sj 真实数据。</p>
    </div>
    <button class="theme-toggle" id="themeToggle" type="button">切换深色 / 浅色</button>
  </header>

  <section class="card">
    <div class="card-title">岗位重点知识</div>
    <p class="card-sub">热度越靠右越常被问 · 圆点越大题目越多</p>

    <div class="chart-wrap" id="swarmPlot"></div>
    <div class="legend">
      <span><span class="dot" style="background:#4f46e5"></span>高热度</span>
      <span><span class="dot" style="background:#6366f1"></span>中热度</span>
      <span><span class="dot" style="background:#818cf8"></span>低热度</span>
      <span>圆点大小 = 题目数 · 悬停看主题名</span>
    </div>

    <!-- 今日该刷：来自 due 队列 -->
    <div class="today-head">
      <div class="tt">今日该刷 <span class="ts">来自「今日复习」队列 · 按风险权重排序 · 共 236 道待复习</span></div>
      <button class="today-cta-btn">进入今日复习 →</button>
    </div>
    <div class="today-list" id="todayList"></div>
  </section>

</div>

<script>
  /* ============ 真实 sj 数据 ============ */
  const data = [
    { name: "RAG系统设计", heat: 42, q: 23 }, { name: "Agent架构与范式", heat: 37, q: 19 },
    { name: "评估安全与优化", heat: 31, q: 19 }, { name: "其他", heat: 26, q: 18 },
    { name: "框架与中间件", heat: 21, q: 18 }, { name: "数据库基础", heat: 20, q: 15 },
    { name: "工具调用与协议集成", heat: 17, q: 12 }, { name: "模型与框架选型", heat: 17, q: 13 },
    { name: "编程语言基础", heat: 17, q: 16 }, { name: "缓存设计与优化", heat: 17, q: 13 },
    { name: "高并发与限流", heat: 13, q: 9 }, { name: "记忆与上下文管理", heat: 11, q: 3 },
    { name: "项目介绍与背景", heat: 10, q: 9 }, { name: "数据结构", heat: 10, q: 10 },
    { name: "算法手撕", heat: 10, q: 9 }, { name: "AI Coding与代码智能", heat: 9, q: 6 },
    { name: "操作系统与网络", heat: 9, q: 7 }, { name: "难点攻关与优化", heat: 8, q: 4 },
    { name: "分布式事务与一致性", heat: 6, q: 6 }, { name: "反思与改进", heat: 5, q: 4 },
    { name: "系统架构设计", heat: 4, q: 3 }, { name: "Prompt工程", heat: 3, q: 3 },
  ];
  const maxHeat = 42, maxQ = 23;

  // due 队列 top 题（真实：B4记忆/B2 RAG/B1 Agent...）
  const todayQueue = [
    { q: "Agent开发，记忆怎么进行管理，用什么结构", cat2: "记忆与上下文管理", freq: 6 },
    { q: "详细介绍一下RAG的具体流程", cat2: "RAG系统设计", freq: 5 },
    { q: "介绍一下React模式，它和CoT还有Plan模式的区别", cat2: "Agent架构与范式", freq: 4 },
    { q: "为什么要有multi agent，与单agent对比", cat2: "Agent架构与范式", freq: 4 },
    { q: "如何对Agent的产出做一个评估？", cat2: "评估安全与优化", freq: 4 },
  ];

  /* ---------- 蜜蜂图（确定性行堆叠，无重叠；遵循 dataviz 标签最佳实践） ---------- */
  const plot = { W: 640, H: 320, padL: 46, padR: 46, padT: 20, padB: 38 };
  const plotW = plot.W - plot.padL - plot.padR;
  const rowH = 52;
  const xOf = h => plot.padL + (h / maxHeat) * plotW;
  // 圆点统一主题色（按热度同色系深浅），最小 11px 保证可见
  const dotColor = (h, dark) => {
    const p = h / maxHeat;
    if (dark) {
      if (p >= 0.7) return "#a5b4fc";
      if (p >= 0.4) return "#818cf8";
      return "#6366f1";
    }
    if (p >= 0.7) return "#4f46e5";
    if (p >= 0.4) return "#6366f1";
    return "#818cf8";
  };
  // 标签：只标 top 4 高热度主题；字体近黑/近白（高对比，非配色）
  const labelInk = dark => dark ? "#ffffff" : "#111111";
  const TOP_LABEL_COUNT = 4;
  function layout() {
    const sorted = data.slice().sort((a, b) => b.heat - a.heat);
    const placed = [];
    for (const d of sorted) {
      const r = 12 + (d.q / maxQ) * 10;   // 圆点按题目数缩放，min 12
      const x = xOf(d.heat);
      let y = null;
      for (let ri = 0; ri < 12; ri++) {
        const yy = plot.padT + ri * rowH;
        const clash = placed.some(p => Math.abs(p.x - x) < p.r + r + 3 && Math.abs(p.y - yy) < p.r + r + 3);
        if (!clash) { y = yy; break; }
      }
      if (y === null) y = plot.padT;
      placed.push({ x, y, r, d });
    }
    return placed;
  }
  function drawSwarm() {
    const el = document.getElementById("swarmPlot");
    const dark = document.body.getAttribute("data-theme") === "dark";
    const grid = dark ? "#2e2a27" : "#f1efe9";
    const muted = dark ? "#8f8881" : "#a8a29e";
    const W = plot.W, H = plot.H;
    const pts = layout();
    let svg = '';
    for (let h = 0; h <= 40; h += 10) {
      const x = plot.padL + (h / maxHeat) * plotW;
      svg += '<line x1="' + x + '" y1="' + plot.padT + '" x2="' + x + '" y2="' + (H - plot.padB) + '" stroke="' + grid + '" stroke-width="1"></line>';
      svg += '<text x="' + x + '" y="' + (H - plot.padB + 14) + '" text-anchor="middle" font-size="9" fill="' + muted + '">' + h + '</text>';
    }
    svg += '<text x="' + (W / 2) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="10" fill="' + muted + '">被问次数 →</text>';
    // 先画所有圆点（统一主题色 + 白描边）
    pts.forEach(p => {
      const color = dotColor(p.d.heat, dark);
      svg += '<circle cx="' + p.x + '" cy="' + p.y + '" r="' + p.r + '" fill="' + color + '" opacity=".7" stroke="' + (dark ? "#1a1816" : "#ffffff") + '" stroke-width="1.5">' +
        '<title>' + p.d.name + ' · 被问 ' + p.d.heat + ' 次 · ' + p.d.q + ' 题</title></circle>';
    });
    // 只给 top 4 高热度主题直接标名：左对齐放点右侧，黑色/白色高对比
    const top4 = pts.slice().sort((a, b) => b.d.heat - a.d.heat).slice(0, TOP_LABEL_COUNT);
    top4.forEach(p => {
      const lx = p.x + p.r + 6;
      const ly = p.y + 4;
      svg += '<text x="' + lx + '" y="' + ly + '" font-size="10.5" font-weight="600" fill="' + labelInk(dark) + '">' + p.d.name + '</text>';
    });
    el.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;max-width:700px">' + svg + '</svg>';
  }

  /* ---------- 今日该刷列表 ---------- */
  function drawToday() {
    const el = document.getElementById("todayList");
    el.innerHTML = todayQueue.map((t, i) => {
      const top = i < 2;
      return '<div class="today-item">' +
        '<div class="today-rank' + (top ? ' top' : '') + '">' + (i + 1) + '</div>' +
        '<div class="today-body">' +
          '<div class="today-q">' + t.q + '</div>' +
          '<div class="today-meta"><span class="today-tag">' + t.cat2 + '</span></div>' +
        '</div>' +
        '<div class="today-heat">被问 ' + t.freq + '</div>' +
        '<button class="today-cta-btn">去刷 →</button>' +
      '</div>';
    }).join("");
  }

  drawSwarm();
  drawToday();
  document.getElementById("themeToggle").addEventListener("click", function () {
    const body = document.body;
    body.setAttribute("data-theme", body.getAttribute("data-theme") === "light" ? "dark" : "light");
    drawSwarm();
  });
</script>
</body>
</html>
